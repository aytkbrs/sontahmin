name: Hourly Coupon Pipeline

on:
  schedule:
    # Her saat başı çalışır (UTC). Bülten değişmediyse pipeline kendisi atlar.
    - cron: "0 * * * *"
  workflow_dispatch: {}   # GitHub UI'dan elle tetikleme

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run pipeline
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/generate_coupons.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/coupons_today.json
          git add data/iddaa.sqlite3 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: güncelleme $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
